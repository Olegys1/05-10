<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="box">
        <h2>Register</h2>
        
        <div class="progress">
            Filled fields: <span id="counter">0</span> / 4
        </div>

        <form id="regForm" novalidate>
            <div class="group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter name">
                <div class="error" id="name-err"></div>
            </div>

            <div class="group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter email">
                <div class="error" id="email-err"></div>
            </div>

            <div class="group">
                <label for="pass">Password</label>
                <input type="password" id="pass" name="pass" placeholder="Min 6 characters">
                <div class="error" id="pass-err"></div>
            </div>

            <div class="group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" placeholder="Repeat password">
                <div class="error" id="confirm-err"></div>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
